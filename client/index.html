<!doctype html>
<html lang="en" class="app-dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Inco Tech Solutions - Premium Computer Retail & Repair Services. New & refurbished laptops, accessories, and expert repair diagnostics."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Inco Tech Solutions | Computer Retail & Repair</title>

    <!-- Open Graph (social sharing + Google site name hint) -->
    <meta property="og:site_name" content="Inco Tech Solutions" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://incotechsolutions.com/" />
    <meta property="og:title" content="Inco Tech Solutions | Computer Retail & Repair" />
    <meta property="og:description" content="Inco Tech Solutions - Premium Computer Retail & Repair Services. New & refurbished laptops, accessories, and expert repair diagnostics." />

    <!-- WebSite JSON-LD: tells Google the preferred site name -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Inco Tech Solutions",
      "alternateName": "Inco Tech",
      "url": "https://incotechsolutions.com",
      "potentialAction": {
        "@type": "SearchAction",
        "target": {
          "@type": "EntryPoint",
          "urlTemplate": "https://incotechsolutions.com/catalog?q={search_term_string}"
        },
        "query-input": "required name=search_term_string"
      }
    }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
